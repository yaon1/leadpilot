{{- $fullname := include "leadpilot.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-web
  labels: {{- include "leadpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "leadpilot.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "leadpilot.selector" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.web }}:{{ include "leadpilot.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: API_UPSTREAM
              value: "http://{{ $fullname }}-api:3000"
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            httpGet: { path: /, port: http }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-web
  labels: {{- include "leadpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector: {{- include "leadpilot.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
