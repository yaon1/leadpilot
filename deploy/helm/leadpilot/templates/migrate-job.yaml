{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "leadpilot.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "leadpilot.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.api }}:{{ include "leadpilot.tag" . }}"
          command: ["node", "dist/cli/migrate.js"]
          env: {{- include "leadpilot.env" . | nindent 12 }}
          securityContext: {{- include "leadpilot.securityContext" . | nindent 12 }}
{{- end }}
