name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests, eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Prompt eval (mock provider, fails below threshold)
        run: pnpm eval
      - run: pnpm build

  integration:
    name: Integration tests (Postgres + pgvector, Redis via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @leadpilot/shared build
      - run: pnpm test:integration

  deploy-config:
    name: Validate docker compose and Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/leadpilot
      - name: Render and validate manifests
        run: |
          helm template demo deploy/helm/leadpilot --set database.url=postgres://x \
            --set ingress.enabled=true --set api.autoscaling.enabled=true > rendered.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.6.7 -summary -strict /w/rendered.yaml

  images:
    name: Build images${{ github.ref == 'refs/heads/main' && ' and push to GHCR' || '' }}
    needs: [check, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/leadpilot-${{ matrix.target }}:latest
            ghcr.io/${{ github.repository_owner }}/leadpilot-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
